[workspace]
resolver = "2"
members = [
    "crates/shadow-protocol",
    "crates/shadow-crypto",
    "crates/shadow-transfer",
    "crates/shadow-discovery",
    "apps/windows",
    "apps/android/rust",
    "tests/e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Shadow Transfer Contributors"]

[workspace.dependencies]
blake3 = "1.5"
bytes = "1"
criterion = "0.5"
dirs = "5"
eframe = "0.29"
futures-util = "0.3"
getrandom = "0.2"
hex = "0.4"
if-addrs = "0.12"
jni = "0.22"
rfd = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
socket2 = "0.5"
tempfile = "3"
thiserror = "1"
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
